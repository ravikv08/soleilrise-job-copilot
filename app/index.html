<title>SoleilRise Job Copilot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>

/* Theme: SoleilRise. Sun-orange on black; sunset stripe under the top bar; chips in ember, orange, amber, peach and an inverted ink chip */
:root {
  --bg:#fbf7f2; --surface:#ffffff; --sunk:#f3ece4; --fg:#16120f; --muted:#6b6058; --line:#eadfd3;

  --good:#11865b; --good-bg:#dcf4e8; --mid:#b86a00; --mid-bg:#fff0d6; --bad:#d23a2c; --bad-bg:#ffe2dc;
  --ins:#0f7d55; --ins-bg:#d9f3e6; --del:#c8352a; --del-bg:#ffe0da;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif; --body:"Figtree", system-ui, sans-serif; --mono:"JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0d0b0a; --surface:#181513; --sunk:#221d1a; --fg:#f7efe7; --muted:#b4a79b; --line:#2f2824;
  --accent:#ff7a2e; --accent-fg:#160c05; --accent-soft:#3a2214; --hl-sky:#2c2521; --hl-mark:rgba(255,122,46,.5);
  --good:#5bd6a0; --good-bg:#10322a; --mid:#ffbf4d; --mid-bg:#382a10; --bad:#ff8577; --bad-bg:#3d1914;
  --ins:#6fdcae; --ins-bg:#12332a; --del:#ff8f82; --del-bg:#3d1915; color-scheme:dark } }
:root[data-theme="dark"] {
  --bg:#0d0b0a; --surface:#181513; --sunk:#221d1a; --fg:#f7efe7; --muted:#b4a79b; --line:#2f2824;
  --accent:#ff7a2e; --accent-fg:#160c05; --accent-soft:#3a2214; --hl-sky:#2c2521; --hl-mark:rgba(255,122,46,.5);
  --good:#5bd6a0; --good-bg:#10322a; --mid:#ffbf4d; --mid-bg:#382a10; --bad:#ff8577; --bad-bg:#3d1914;

* { box-sizing:border-box; }
body { background:var(--bg); color:var(--fg); font:15px/1.5 var(--body); }

.gut { padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); }
.bar { position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--surface); }
.bar { background:#0d0b0a; color:#f7efe7; }

.brand em { font-style:normal; color:#ff7a2e; }
.brand .bname { display:grid; line-height:1.05; } .brand small { font:700 .62rem var(--body); color:#b4a79b; letter-spacing:.14em; text-transform:uppercase; margin-top:2px; }

.row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }

.hero > * { position:relative; }

/* stat chips */

.stat:nth-child(1) { background:var(--sun2); } .stat:nth-child(2) { background:var(--sun3); } .stat:nth-child(3) { background:linear-gradient(135deg, var(--sun1), var(--sun2) 55%, var(--sun3)); color:#fff; }
.stat:nth-child(4) { background:var(--fg); color:var(--bg); } .stat:nth-child(5) { background:var(--hl-orange); } .stat:nth-child(6) { background:var(--surface); color:var(--fg); border:1.5px dashed var(--line); }
/* job cards */
.jobs { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:14px; }
.job { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; display:grid; gap:12px; align-content:start; position:relative; }
.job::before { content:""; position:absolute; left:0; top:14px; bottom:14px; width:4px; border-radius:0 4px 4px 0; background:var(--c, var(--line)); }

.ring.lg { width:112px; height:112px; } .ring.lg > div { width:90px; height:90px; } .ring.lg b { font-size:2rem; } .ring.lg small { font-size:.66rem; }
.ring.s-good { --rc:var(--good); } .ring.s-mid { --rc:var(--mid); } .ring.s-bad { --rc:var(--bad); }

.jfoot select { width:auto; padding:5px 8px; font-size:.8rem; border-radius:8px; }

.lamp.good { background:var(--good); box-shadow:0 0 16px var(--good); } .lamp.mid { background:var(--mid); box-shadow:0 0 16px var(--mid); } .lamp.bad { background:var(--bad); box-shadow:0 0 16px var(--bad); }
.modes { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

.mode { text-align:left; background:var(--surface); border:2px solid var(--line); border-radius:14px; padding:14px 18px; cursor:pointer; color:var(--fg); font:inherit; display:grid; gap:2px; }
.mode b { font:800 1.15rem var(--display); } .mode span { font-size:.84rem; color:var(--muted); }
.mode.on { border-color:var(--accent); background:var(--accent-soft); } .mode.on b { color:var(--accent); }

.stepbar li span { width:22px; height:22px; border-radius:50%; display:grid; place-items:center; background:var(--line); color:var(--fg); font-size:.74rem; flex:none; }
.stepbar li.done { background:var(--good-bg); color:var(--good); } .stepbar li.done span { background:var(--good); color:var(--surface); }
.stepbar li.cur { background:var(--accent-soft); color:var(--accent); outline:2px solid var(--accent); } .stepbar li.cur span { background:var(--accent); color:var(--accent-fg); }

.pgrid .g2 { background:var(--fg); } .pgrid .g3 { background:var(--accent); } .pgrid .g4 { background:#ffb020; } .pgrid .g5 { background:var(--good); }

(() => {

/* storage */
const chains = new Map();
function write(id, data, merge=true) {
  const prev = chains.get(id) || Promise.resolve();
  const p = prev.then(async () => {

    const ref = S.db.collection("data/users/" + S.uid).doc(id);

}
function setSaved(t) { $("#saveState").textContent = t; }
function saveJob(job, patch) { Object.assign(job, patch, {updated: Date.now()}); render(); return write(job.id, {...patch, updated: job.updated}); }
async function delJob(job) {
  S.jobs.delete(job.id); if (S.jobId === job.id) { S.jobId = null; S.view = isSent(job) ? "apps" : "studio"; } render();
  if (S.db && S.uid) try { await S.db.collection("data/users/" + S.uid).doc(job.id).delete(); } catch (e) {}
}
function saveProfile(patch) { S.profile = {...(S.profile||{kind:"profile"}), ...patch, updated: Date.now()}; render(); return write("profile", S.profile, false); }

async function boot() {
  render();

  if (!C || !C.use) { S.ready = true; setSaved("Preview mode: nothing is saved"); render(); return; }
  const [db, user, sample, dl, mcp] = await Promise.all(["db","user","sample","downloads","mcp"].map(n => C.use(n).catch(() => null)));
  S.sample = sample; S.dl = dl; S.mcp = mcp;
  S.browser = !!mcp; // try the desktop browser; the first failed call switches to paste mode
  const uid = user ? await user.id() : null;
  if (db && uid) {
    S.db = db; S.uid = uid;
    const col = db.collection("data/users/" + uid);
    col.doc("discovered").onSnapshot(s => { if (s.exists) S.disc = {...s.data(), items: [...(s.data().items||[])]}; S.discLoaded = true; mergeMorning(); render(); }, () => {});
    col.doc("morning").onSnapshot(s => { if (s.exists) { S.morning = s.data(); mergeMorning(); } }, () => {});
    col.doc("profile").onSnapshot(s => { if (s.exists) S.profile = {...s.data()}; S.ready = true; render(); }, () => {});
    col.where("kind","==","job").onSnapshot(snap => {
      snap.docChanges().forEach(ch => { if (ch.type === "removed") S.jobs.delete(ch.doc.id); else S.jobs.set(ch.doc.id, {...ch.doc.data(), id: ch.doc.id}); });
      S.ready = true; render(); if (!S.jdRetried) { S.jdRetried = true; setTimeout(retryUnread, 4000); }

  } else setSaved("Sign in to save. Changes last until you close this page.");

}

/* ---------------- helpers ---------------- */
function urlKey(u) {
  try { const x = new URL(u.trim()); const keep = ["gh_jid","jobId","jid","id","job"]; const q = [...x.searchParams].filter(([k]) => keep.includes(k)).map(([k,v]) => k+"="+v).join("&");
    return (x.host.replace(/^www\./,"") + x.pathname.replace(/\/+$/,"") + (q ? "?"+q : "")).toLowerCase(); } catch (e) { return u.trim().toLowerCase(); }
}
function nid() { return "job_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function camel(s, max=40) { let out = ""; for (const w of String(s||"").replace(/\([^)]*\)/g," ").replace(/[^A-Za-z0-9 ]+/g," ").split(/\s+/).filter(Boolean)) { const n = out + w[0].toUpperCase() + w.slice(1); if (n.length > max && out) break; out = n; } return out || "Job"; }
function fileBase(job) { const f = String(job.fileName||"").replace(/\.(docx|pdf)$/i,"").replace(/[^A-Za-z0-9_\-]+/g,"").trim(); return f || `${camel(job.company, 24)}_${camel(job.title)}_Resume_${(job.tailoredAt || today()).replace(/-/g,"")}`; }
function tier(n) { return n >= 80 ? ["strong","Strong fit"] : n >= 70 ? ["mid","Moderate fit"] : ["low","Stretch"]; }
function words(s) { return String(s||"").toLowerCase().match(/[a-z0-9][a-z0-9+#.\-/]*/g) || []; }
function wordDiff(a, b) {
  if (!a) return `<ins>${esc(b)}</ins>`; if (!b) return `<del>${esc(a)}</del>`;
  const A = a.split(/(\s+)/), B = b.split(/(\s+)/), n = A.length, m = B.length;
  if (n*m > 400000) return `<del>${esc(a)}</del> <ins>${esc(b)}</ins>`;
  const L = Array.from({length:n+1}, () => new Uint16Array(m+1));
  for (let i=n-1;i>=0;i--) for (let j=m-1;j>=0;j--) L[i][j] = A[i]===B[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j], L[i][j+1]);
  let i=0,j=0,out="",d="",s="";
  const flush = () => { if (d.trim()) out += `<del>${esc(d)}</del>`; else out += esc(d); if (s.trim()) out += `<ins>${esc(s)}</ins>`; else out += esc(s); d=""; s=""; };
  while (i<n && j<m) { if (A[i]===B[j]) { flush(); out += esc(A[i]); i++; j++; } else if (L[i+1][j] >= L[i][j+1]) d += A[i++]; else s += B[j++]; }
  while (i<n) d += A[i++]; while (j<m) s += B[j++]; flush();
  return out;
}

/* ---------------- resume model ---------------- */
// resume = {name, contact:[lines], headline, summary, experience:[{company,title,dates,bullets:[]}], projects:[], skills:[{label,items}], education:[{text,sub:[]}]}
function resumeText(r) {
  if (!r) return "";
  return [r.name, ...(r.contact||[]), r.headline, r.summary,
    ...(r.experience||[]).flatMap(e => [e.company+" "+e.title, ...(e.bullets||[])]),
    ...(r.projects||[]), ...(r.skills||[]).map(s => s.label+": "+s.items), ...(r.education||[]).flatMap(e => [e.text, ...(e.sub||[])])].join("\n");
}
function srcText(m, src) {
  const mm = /^E(\d+)\.(\d+)$/.exec(src||""); if (mm) return m.experience?.[+mm[1]]?.bullets?.[+mm[2]];
  const pp = /^P(\d+)$/.exec(src||""); if (pp) return m.projects?.[+pp[1]];
  return undefined;
}
function skillsLines(sk) { return (sk||[]).map(s => `${s.label}: ${s.items}`).join("\n"); }

function computeChanges(m, r) {
  const ch = [];
  const banned = t => BANNED.filter(b => String(t).toLowerCase().includes(b));
  if (r.headline && r.headline.trim() !== (m.headline||"").trim()) ch.push({id:"headline", op:"Rewrite", where:"Headline", before:m.headline||"", after:r.headline, reason:r.reasons?.headline, banned:banned(r.headline)});
  if (r.summary && r.summary.trim() !== (m.summary||"").trim()) ch.push({id:"summary", op:"Rewrite", where:"Summary", before:m.summary||"", after:r.summary, reason:r.reasons?.summary, banned:banned(r.summary)});
  if (r.skills?.length && skillsLines(r.skills) !== skillsLines(m.skills)) ch.push({id:"skills", op:"Reorder", where:"Technical skills", before:skillsLines(m.skills), after:skillsLines(r.skills), reason:r.reasons?.skills, banned:banned(skillsLines(r.skills))});
  const lists = [];
  (m.experience||[]).forEach((e, i) => lists.push({key:"E"+i, label:e.company, orig:e.bullets||[], prefix:`E${i}.`, out:(r.experience||[]).find(x => +x.i === i)?.bullets}));
  if (m.projects?.length) lists.push({key:"P", label:"Projects", orig:m.projects, prefix:"P", out:r.projects});
  for (const L of lists) {
    if (!Array.isArray(L.out)) continue;
    const used = new Set();
    L.out.forEach((b, k) => {
      const t = srcText(m, b.src);
      if (b.src && t !== undefined && String(b.src).startsWith(L.prefix)) {
        used.add(b.src);
        if (String(b.text).trim() !== t.trim()) ch.push({id:"edit:"+b.src, op:"Edit", where:L.label, before:t, after:b.text, reason:b.reason, banned:banned(b.text)});
      } else ch.push({id:`add:${L.key}:${k}`, op:"Add", cls:"add", where:L.label, before:"", after:b.text, reason:b.reason, flag:"New bullet: confirm it's true", banned:banned(b.text)});
    });
    L.orig.forEach((t, j) => { const src = L.prefix + j; if (!used.has(src)) ch.push({id:"rm:"+src, op:"Remove", cls:"rm", where:L.label, before:t, after:"", reason:(r.removed||[]).find(x => x.src === src)?.reason || "Low relevance for this role; keeps the resume at 2 pages."}); });

}
function finalResume(m, r, dec, edits) {
  dec = dec || {}; edits = edits || {};
  const on = id => dec[id] !== false;
  const val = (id, t) => edits[id] != null ? edits[id] : t;
  const out = JSON.parse(JSON.stringify(m));
  if (r.headline && on("headline")) out.headline = val("headline", r.headline);
  if (r.summary && on("summary")) out.summary = val("summary", r.summary);
  if (r.skills?.length && on("skills")) out.skills = r.skills;
  const build = (orig, list, prefix, key) => {
    if (!Array.isArray(list)) return orig;
    const res = [], used = new Set();
    list.forEach((b, k) => {
      const t = srcText(m, b.src);
      if (b.src && t !== undefined && String(b.src).startsWith(prefix)) { used.add(b.src); res.push(on("edit:"+b.src) ? val("edit:"+b.src, b.text) : t); }
      else if (on(`add:${key}:${k}`)) res.push(val(`add:${key}:${k}`, b.text));
    });
    orig.forEach((t, j) => { if (!used.has(prefix+j) && !on("rm:"+prefix+j)) res.push(t); });
    return res;
  };
  out.experience = (m.experience||[]).map((e, i) => ({...e, bullets: build(e.bullets||[], (r.experience||[]).find(x => +x.i === i)?.bullets, `E${i}.`, "E"+i)}));

}
function retention(a, b) {
  const A = words(resumeText(a)), B = words(resumeText(b)); const bag = new Map(); A.forEach(w => bag.set(w, (bag.get(w)||0)+1));

}
function kwCover(kws, text) {
  const t = text.toLowerCase();

const CTYPES_NET = [["hm","Hiring manager"],["recruiter","Recruiter"],["leader","Team leader"],["referral","Employee referral"],["connection","My connection"]];
const CSTATUS = ["To contact","Messaged","Replied","Referred me","No response"];
const liPeople = (kw, net) => { const p = new URLSearchParams({keywords: kw, origin: "GLOBAL_SEARCH_HEADER"}); if (net) p.set("network", JSON.stringify(net)); return "https://www.linkedin.com/search/results/people/?" + p.toString(); };
const coName = j => String(j.company || "").replace(/\s*\(.*?\)\s*/g, " ").trim().replace(/,?\s+(inc|llc|corp|corporation|ltd)\.?$/i, "").trim();
const liPeopleCo = (kw, co, net) => { const p = new URLSearchParams({keywords: kw, origin: "FACETED_SEARCH"}); if (co) p.set("company", co); if (net) p.set("network", JSON.stringify(net)); return "https://www.linkedin.com/search/results/people/?" + p.toString(); };
function netPlan(job) {
  // Three searches built from this posting: the team that hires, the recruiter for that team, and warm paths in.
  // Claude reads the posting first (job.net) for the team/product names; title words are the fallback.
  const co = coName(job), t = String(job.title || ""), n = job.net || {};
  const q = a => [...new Set(a.filter(Boolean).map(x => String(x).trim()).filter(x => x.length > 1))];
  const orT = a => a.length ? "(" + a.map(x => `"${x}"`).join(" OR ") + ")" : "";
  const team = q(n.team_keywords || []).slice(0, 4);
  const fn = q(n.function_keywords?.length ? n.function_keywords : (t.match(/\b(machine learning|AI|ML|data engineering|data|analytics|platform|agents?|genai|solutions|security|infrastructure)\b/gi) || ["engineering"])).slice(0, 3);
  const lv = q((n.manager_titles || []).join(" | ").match(/managing director|executive director|senior director|vice president|engineering manager|senior manager|director|head|\bvp\b|manager/gi) || []).map(x => x.replace(/\b\w/g, c => c.toUpperCase()).replace(/^Vp$/, "VP"));
  const mgr = q(lv.length ? lv : LEADER.test(t) ? ["VP", "Senior Director", "Head"] : ["Engineering Manager", "Senior Manager", "Director"]).slice(0, 4);
  const peers = q(n.peer_titles || []).slice(0, 3), rk = q(n.recruiter_keywords?.length ? n.recruiter_keywords : fn).slice(0, 3);
  const past = (S.profile?.resume?.experience || []).map(e => coName(e)).filter(x => x && x.toLowerCase() !== co.toLowerCase() && !/soleil/i.test(x)).slice(0, 4);
  const schools = (S.profile?.resume?.education || []).map(e => (String(e.text).match(/University of [A-Z][a-z]+|[A-Z][a-z]+ University|Stanford/) || [])[0]).filter(Boolean).slice(0, 2);
  const area = team.length ? team : fn, where = n.department || (team.length ? team.join(" / ") : fn.join(" / "));
  return [
    {k: "hm", label: "Hiring team", why: `${mgr.slice(0, 3).join(", ")} on ${where} at ${co}: the people most likely to own this hire. Message the best match directly.`,
      links: [["Search the team", liPeopleCo(`"${co}" ${orT(mgr)} ${orT(area)}`, co)], ...(team.length ? [["Wider: " + fn.join(", "), liPeopleCo(`"${co}" ${orT(mgr)} ${orT(fn)}`, co)]] : [])]},
    {k: "recruiter", label: "Recruiter for this team", why: `Recruiters at ${co} who hire for ${n.recruiter_focus || fn.join(", ")}. Tell them you applied, with the job link.`,
      links: [["Search recruiters", liPeopleCo(`"${co}" (recruiter OR "talent acquisition" OR sourcer) ${orT(rk)}`, co)]]},
    {k: "connection", label: "Warm intro or referral", why: `Your 1st-degree connections at ${co} first, then 2nd-degree people on ${where}${peers.length ? ` (${peers.join(", ")})` : ""} a mutual can introduce, then former colleagues${past.length ? ` from ${past.slice(0, 3).join(", ")}` : ""}. Most companies pay a referral bonus.`,
      links: [["1st-degree", liPeopleCo(`"${co}"`, co, ["F"])], ["2nd-degree on the team", liPeopleCo(`"${co}" ${orT(peers.length ? q([...peers, ...area]).slice(0, 5) : area)}`, co, ["S"])], ...(past.length || schools.length ? [["Former colleagues", liPeopleCo(`"${co}" ${orT([...past, ...schools])}`, co)]] : [])]}];
}

    const out = await S.sample.json(`From this job posting, infer who is most likely involved in hiring, so the candidate can search LinkedIn for the right people. Do NOT guess or invent names. Only if the posting text explicitly names a recruiter or hiring manager (e.g. "Recruiter: Jane Doe"), list them in named_in_posting; otherwise return an empty list.

}

function contactScore(job, c) {
  const why = [], base = {hm: 82, leader: 68, recruiter: 64, referral: 60, connection: 55}[c.type] ?? 50; let sc = base;
  why.push({hm: "likely decides on this hire", leader: "leads the relevant team", recruiter: "recruits for the company", referral: "can refer you internally", connection: "already knows you"}[c.type] || "contact at the company");
  if (c.confirmed) { sc += 12; why.push("confirmed hiring contact"); }
  if (c.degree === "1") { sc += 14; why.push("1st-degree connection"); } else if (c.degree === "2") { sc += 7; why.push("2nd-degree, a mutual can introduce you"); }
  const past = (S.profile?.resume?.experience || []).map(e => coName(e).toLowerCase()).filter(Boolean), txt = (String(c.note) + " " + String(c.role)).toLowerCase();
  const shared = past.find(p => p.length > 2 && txt.includes(p.split(" ")[0])); if (shared || /worked|school|alumni|university|former|colleague|met /.test(String(c.note).toLowerCase())) { sc += 8; why.push(shared ? `shared employer (${shared})` : "shared background"); }
  const kw = (job.net?.team_keywords || []).map(x => String(x).toLowerCase()); if (kw.some(k => String(c.role).toLowerCase().includes(k))) { sc += 6; why.push("title matches the team"); }
  return {score: Math.min(99, sc), why: why.join(" · ")};
}

function catScores(r) {
  const norm = t => " " + String(t).toLowerCase().replace(/[^a-z0-9+\- ]/g, " ").replace(/\s+/g, " ") + " ";
  const has = (txt, w) => txt.includes(" " + w + " ") || (w.length > 5 && txt.includes(w));
  const bullets = (r.experience || []).flatMap(e => (e.bullets || []).map(b => norm(b + " " + e.title + " " + e.company)));
  const all = norm(resumeText(r));
  const yearsOf = e => { const ys = (String(e.dates).match(/(19|20)\d{2}/g) || []).map(Number); const end = /present|current/i.test(e.dates) ? new Date().getFullYear() : Math.max(...ys, 0); return ys.length ? Math.max(0.5, end - Math.min(...ys)) : 0; };
  const totalY = (r.experience || []).reduce((s, e) => s + yearsOf(e), 0) || 1;
  return CATS.map(c => {
    const distinct = c.t.filter(w => has(all, w));
    const share = bullets.length ? bullets.filter(b => c.t.some(w => has(b, w))).length / bullets.length : 0;
    const roleY = (r.experience || []).filter(e => { const h = norm(e.title + " " + e.company + " " + (e.bullets || []).join(" ")); return c.t.filter(w => has(h, w)).length >= 3; }).reduce((s, e) => s + yearsOf(e), 0) / totalY;
    const score = Math.round(100 * (0.35 * Math.min(1, distinct.length / (c.t.length * 0.6)) + 0.35 * Math.min(1, share / 0.6) + 0.3 * Math.min(1, roleY)));
    return {k: c.k, score: Math.max(5, Math.min(99, score)), hits: distinct.slice(0, 6), share: Math.round(share * 100), years: Math.round(roleY * totalY)};
  });
}
/* Career paths: your own tiers (interview probability, fit, comp, security, AI growth, leadership, equity; 1-5 each, out of 35).

const FSI_RX = /\b(financial|fintech|bank|banking|payments?|fsi|capital markets|insurance|wealth|lending|credit)\b/i, LEAD_RX = /\b(director|head|vp|vice president|chief|lead|leader|manager)\b/i;

const INDUSTRY_RX = {fintech: FSI_RX, health: /\b(health|healthcare|medical|clinical|pharma|biotech|life sciences)\b/i, ai: /\b(ai|machine learning|llm|genai)\b/i, chips: /\b(semiconductor|silicon|chip|gpu)\b/i, robotics: /\b(robotics|autonomy|autonomous)\b/i, data: /\b(data)\b/i, saas: /\b(saas|software)\b/i};

    const groups = p.all.map(g => (Array.isArray(g) ? g : [g]).filter(Boolean).map(wordRx)).filter(g => g.length), ind = p.industry && p.industry !== "any" ? p.industry : "";

  S.busy.set("paths", 1); render();
  try {
    const out = await S.sample.json(`Suggest 5-8 career paths for this candidate's job search, tiered by how worth their time each is: Tier 1 = best odds of an interview and best fit (spend 80% of time), Tier 2 = opportunistic, Tier 3 = bridge or decline. Score each 1-5 on interview probability, fit, compensation, security, AI growth, leadership and equity, and give the total out of 35. Base it ONLY on the resume and target roles below; do not assume anything else.
For matching job titles, give "all": a list of 1-3 word groups; a job title matches when it contains at least one word or phrase from EVERY group (e.g. [["director","head","vp"],["data","ai","machine learning"]]). Use "industry" only when the path is industry-specific: one of fintech, health, ai, chips, robotics, data, saas; otherwise "".
Reply with only JSON: [{"tier":1,"name":"path name — where","short":"3-5 word label","score":30,"role":"one search title for it, e.g. Director of Data & AI","all":[["..."],["..."]],"industry":""}]
TARGET ROLES: ${String(settings().roles || "").split(/\n+/).slice(0, 5).join("; ")}
RESUME: ${resumeText(r).slice(0, 9000)}`, {cache: false});
    const paths = (Array.isArray(out) ? out : []).filter(p => p?.name && Array.isArray(p.all)).slice(0, 8).map(p => ({tier: +p.tier || 2, name: String(p.name).slice(0, 120), short: String(p.short || "").slice(0, 50), score: Math.max(7, Math.min(35, +p.score || 0)), role: String(p.role || "").slice(0, 80), all: p.all.slice(0, 3).map(g => (Array.isArray(g) ? g : [g]).map(String).slice(0, 10)), industry: String(p.industry || "")}));
    S.busy.delete("paths"); if (paths.length) saveProfile({paths}); else note("Couldn't build paths from your resume. Try again.", "warn");
  } catch (e) { S.busy.delete("paths"); note(errText(e), "err"); render(); }
}
function careerCard() {

function addFromDraft(text) {

  }
  if (!urls.length) {

    const id = nid(), job = {id, kind:"job", url:"", urlKey:"", jd:text.trim().slice(0,30000), pipeline: jdLooksReal(text) ? "ready" : "needs_jd", status:"Draft", created:Date.now(), updated:Date.now()};

}
